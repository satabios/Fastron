
name: Build

on:
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    steps:
      - name: Clone Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Packages
        run: npm run install

      - name: Cache test models
        uses: actions/cache@v4
        with:
          path: third_party/test
          key: test-models-${{ runner.os }}-${{ hashFiles('test/models.json') }}
          restore-keys: |
            test-models-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
            %LOCALAPPDATA%\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Validate
        run: npm run validate

      - name: Build Electron
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder install-app-deps
          case "${{ matrix.os }}" in
            macos*)  npm run build electron mac     ;;
            ubuntu*) npm run build electron linux   ;;
            windows*) npm run build electron windows ;;
          esac

      - name: Upload Artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

      - name: Upload Artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          retention-days: 30

      - name: Upload Artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            dist/*.exe
            dist/*.msi
          retention-days: 30

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - name: Clone Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Lint
        working-directory: vscode-extension
        run: npm run lint

      - name: Sync shared assets from source/
        working-directory: vscode-extension
        run: npm run sync

      - name: Compile TypeScript
        working-directory: vscode-extension
        run: npx tsc -p ./

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        working-directory: vscode-extension
        run: |
          git add -f webview/netron/
          vsce package --no-dependencies

      - name: Upload VS Code extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-vscode-extension
          path: vscode-extension/*.vsix
          retention-days: 30

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]

    steps:
      - name: Clone Git repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
