name: Publish

on:
  push:
    tags: [ 'v**' ]
  workflow_dispatch:  # Add this to allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Git credentials
        run: |
          git config --global user.name "${{ secrets.PUBLISH_GITHUB_USER_NAME || 'satabios' }}"
          git config --global user.email "${{ secrets.PUBLISH_GITHUB_USER_EMAIL || '25417284+satabios@users.noreply.github.com' }}"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install Packages
        run: npm run setup

      - name: Publish Electron
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npx electron-builder install-app-deps
          case "${{ matrix.os }}" in
            macos*)
              if [[ -z "${CSC_LINK}${CSC_KEY_PASSWORD}${APPLE_API_KEY}${APPLE_API_KEY_ID}${APPLE_API_ISSUER}" ]]; then
                echo "Publishing unsigned macOS packages without notarization."
                npx electron-builder --mac --universal --publish always --config.mac.identity=null --config.mac.notarize=false
              elif [[ -z "${CSC_LINK}" || -z "${CSC_KEY_PASSWORD}" || -z "${APPLE_API_KEY}" || -z "${APPLE_API_KEY_ID}" || -z "${APPLE_API_ISSUER}" ]]; then
                echo "Incomplete macOS signing/notarization secrets (CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER)."
                exit 1
              else
                if [[ ! -f "${APPLE_API_KEY}" ]]; then
                  mkdir -p ~/.private_keys
                  echo "${APPLE_API_KEY}" > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
                  export APPLE_API_KEY=~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8
                fi
                npm run publish electron mac
              fi
              ;;
            ubuntu*)
              sudo apt-get install rpm --yes
              npm run publish electron linux
              ;;
            windows*)
              echo "Publishing unsigned Windows packages."
              npx electron-builder --win --x64 --arm64 --publish always --config.win.azureSignOptions=
              ;;
          esac

      - if: startsWith(matrix.os, 'ubuntu')
        name: Publish Python
        shell: bash
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.pypi_api_token }}
        run: |
          if [[ -n "${TWINE_PASSWORD}" ]]; then
            npm run publish python
          else
            echo "Skipping PyPI publication: pypi_api_token is not configured."
          fi

      - if: startsWith(matrix.os, 'ubuntu')
        name: Publish Web
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USER: ${{ secrets.PUBLISH_GITHUB_USER }}
        run: git push origin HEAD:release --force

      - if: false # startsWith(matrix.os, 'macos')
        name: Publish cask
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_USER: ${{ secrets.PUBLISH_GITHUB_USER }}
        run: npm run publish cask

      - if: startsWith(matrix.os, 'windows')
        name: Publish winget
        shell: bash
        env:
          GITHUB_USER: ${{ secrets.PUBLISH_GITHUB_USER }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -n "${GITHUB_USER}" && -n "${GITHUB_TOKEN}" && -n "${WINGET_TOKEN}" ]]; then
            npm run publish winget
          else
            echo "Skipping winget publication: PUBLISH_GITHUB_USER, GH_TOKEN and WINGET_TOKEN are required."
          fi
