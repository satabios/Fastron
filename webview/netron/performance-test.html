<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netron Performance Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #1e1e1e;
            color: #fff;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        
        #graph-svg {
            width: 100%;
            height: 100%;
        }
        
        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            z-index: 1000;
        }
        
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        button:hover {
            background: #106ebe;
        }
        
        #stats {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .stat-label {
            color: #888;
        }
        
        .stat-value {
            color: #0f0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3 style="margin: 0 0 10px 0;">Netron Performance Test</h3>
        <div>
            <button onclick="generateGraph(100)">100 Nodes</button>
            <button onclick="generateGraph(500)">500 Nodes</button>
            <button onclick="generateGraph(1000)">1,000 Nodes</button>
            <button onclick="generateGraph(5000)">5,000 Nodes</button>
            <button onclick="generateGraph(10000)">10,000 Nodes</button>
        </div>
        <div>
            <button onclick="togglePerformanceOverlay()">Toggle Performance</button>
            <button onclick="logStats()">Log Stats</button>
            <button onclick="clearGraph()">Clear</button>
        </div>
        <div id="stats">
            <div><span class="stat-label">Nodes:</span> <span class="stat-value" id="node-count">0</span></div>
            <div><span class="stat-label">Edges:</span> <span class="stat-value" id="edge-count">0</span></div>
            <div><span class="stat-label">Load Time:</span> <span class="stat-value" id="load-time">0ms</span></div>
            <div><span class="stat-label">Memory:</span> <span class="stat-value" id="memory">0MB</span></div>
            <div><span class="stat-label">FPS:</span> <span class="stat-value" id="fps">0</span></div>
            <div><span class="stat-label">Rendering:</span> <span class="stat-value" id="render-mode">-</span></div>
        </div>
    </div>
    
    <div id="container">
        <svg id="graph-svg"></svg>
    </div>

    <script type="module">
        import { Graph, Node, Edge } from './grapher.js';
        
        let currentGraph = null;
        let performanceOverlay = null;
        
        window.generateGraph = async function(nodeCount) {
            const startTime = performance.now();
            
            // Clear existing graph
            clearGraph();
            
            // Create new graph
            const graph = new Graph(false);
            graph.options = { direction: 'vertical' };
            
            // Generate nodes
            console.log(`Generating ${nodeCount} nodes...`);
            const nodes = [];
            for (let i = 0; i < nodeCount; i++) {
                const node = new Node();
                node.id = `node_${i}`;
                node.name = `Node ${i}`;
                node.type = ['layer', 'activation', 'pool', 'normalization'][i % 4];
                
                const header = node.header();
                header.add(`header_${i}`, ['node-item-type'], `Node ${i}`, `Node ${i}`, null);
                
                const list = node.list();
                list.add(list.argument('input', `tensor_${i}`));
                list.add(list.argument('output', `tensor_${i+1}`));
                
                graph.setNode({ name: `node_${i}`, label: node });
                nodes.push(`node_${i}`);
            }
            
            // Generate edges (create a somewhat realistic topology)
            console.log('Generating edges...');
            let edgeCount = 0;
            for (let i = 0; i < nodeCount - 1; i++) {
                // Connect to next node
                if (i < nodeCount - 1) {
                    const edge = new Edge(`node_${i}`, `node_${i+1}`);
                    graph.setEdge(edge);
                    edgeCount++;
                }
                
                // Add some skip connections
                if (i % 10 === 0 && i + 5 < nodeCount) {
                    const edge = new Edge(`node_${i}`, `node_${i+5}`);
                    graph.setEdge(edge);
                    edgeCount++;
                }
            }
            
            console.log(`Generated ${nodeCount} nodes and ${edgeCount} edges`);
            
            // Build graph
            const container = document.getElementById('graph-svg');
            container.innerHTML = '';
            
            console.log('Building graph...');
            await graph.build(document, container);
            
            const endTime = performance.now();
            const loadTime = endTime - startTime;
            
            currentGraph = graph;
            
            // Update stats
            updateStats(graph, loadTime);
            
            console.log(`Graph built in ${loadTime.toFixed(2)}ms`);
            console.log('Optimization mode:', graph._useCanvas ? 'Canvas' : (graph._useLazyLoading ? 'Lazy SVG' : 'Standard SVG'));
        };
        
        window.clearGraph = function() {
            const container = document.getElementById('graph-svg');
            container.innerHTML = '';
            currentGraph = null;
            
            if (performanceOverlay) {
                performanceOverlay.remove();
                performanceOverlay = null;
            }
            
            updateStats(null, 0);
        };
        
        window.togglePerformanceOverlay = function() {
            if (!currentGraph) {
                alert('Please generate a graph first');
                return;
            }
            
            if (performanceOverlay) {
                performanceOverlay.remove();
                performanceOverlay = null;
            } else {
                performanceOverlay = currentGraph.showPerformanceOverlay(document.body);
            }
        };
        
        window.logStats = function() {
            if (!currentGraph) {
                alert('Please generate a graph first');
                return;
            }
            
            const stats = currentGraph.getPerformanceStats();
            console.group('Performance Statistics');
            console.log('Monitor:', stats.monitor);
            console.log('Memory:', stats.memory);
            console.log('Spatial Index:', stats.spatial);
            console.log('Lazy Loading:', stats.lazy);
            console.groupEnd();
            
            // Also log to UI
            alert('Statistics logged to console (F12)');
        };
        
        function updateStats(graph, loadTime) {
            if (!graph) {
                document.getElementById('node-count').textContent = '0';
                document.getElementById('edge-count').textContent = '0';
                document.getElementById('load-time').textContent = '0ms';
                document.getElementById('memory').textContent = '0MB';
                document.getElementById('fps').textContent = '0';
                document.getElementById('render-mode').textContent = '-';
                return;
            }
            
            const stats = graph.getPerformanceStats();
            
            document.getElementById('node-count').textContent = stats.monitor.totalNodes || 0;
            document.getElementById('edge-count').textContent = stats.monitor.totalEdges || 0;
            document.getElementById('load-time').textContent = `${loadTime.toFixed(0)}ms`;
            
            if (stats.memory && stats.memory.usedMB) {
                document.getElementById('memory').textContent = `${stats.memory.usedMB}MB`;
            }
            
            document.getElementById('fps').textContent = stats.monitor.fps || 0;
            
            const mode = graph._useCanvas ? 'Canvas' : (graph._useLazyLoading ? 'Lazy SVG' : 'Standard SVG');
            document.getElementById('render-mode').textContent = mode;
            
            // Update stats periodically
            if (graph) {
                setTimeout(() => updateStats(graph, loadTime), 1000);
            }
        }
        
        // Auto-generate a small graph on load
        window.addEventListener('load', () => {
            console.log('Netron Performance Test Ready');
            console.log('Click buttons to generate graphs of different sizes');
            generateGraph(100);
        });
    </script>
</body>
</html>
